name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n1)
            echo "Descomprimiendo $ZIP"
            mkdir -p proyecto
            unzip -q "$ZIP" -d proyecto
          fi
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)")
          echo "Proyecto en: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: cd "$DIR" && gradle assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SaludBateria-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
